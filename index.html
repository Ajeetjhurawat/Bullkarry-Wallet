<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullkarry Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto p-8">
        <!-- Top Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 id="greeting" class="text-2xl font-bold text-gray-900">Good Morning</h1>
                <p class="text-sm text-gray-500 mt-1 flex items-center gap-2">
                    <span id="walletAddress" class="font-mono">Not Connected</span>
                    <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-semibold">ARC Testnet</span>
                </p>
            </div>
            <button id="connectBtn" class="bg-black text-white px-6 py-2 rounded-xl hover:bg-gray-800 transition font-medium shadow-lg">
                Connect Wallet
            </button>
        </div>

        <!-- Balance Section -->
        <div class="glass-panel rounded-3xl p-8 mb-8 shadow-sm">
            <p class="text-gray-500 font-medium mb-2">Total Balance</p>
            <div class="flex items-end gap-4">
                <h2 id="balanceDisplay" class="text-5xl font-extrabold tracking-tight">0.00 <span class="text-2xl text-gray-400">BUSD</span></h2>
                <button onclick="toggleCurrency()" class="mb-2 text-sm bg-gray-100 px-3 py-1 rounded-lg hover:bg-gray-200 transition">
                    <i class="fa-solid fa-arrows-rotate"></i> Switch to INR
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-5 gap-4 mb-10">
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-sm hover:shadow-md transition border border-gray-100">
                <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mb-3 text-lg"><i class="fa-solid fa-arrow-up"></i></div>
                <span class="font-medium text-sm">Send</span>
            </button>
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-sm hover:shadow-md transition border border-gray-100">
                <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mb-3 text-lg"><i class="fa-solid fa-arrow-down"></i></div>
                <span class="font-medium text-sm">Receive</span>
            </button>
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-sm hover:shadow-md transition border border-gray-100">
                <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mb-3 text-lg"><i class="fa-solid fa-qrcode"></i></div>
                <span class="font-medium text-sm">Scan</span>
            </button>
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-sm hover:shadow-md transition border border-gray-100">
                <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mb-3 text-lg"><i class="fa-solid fa-plus"></i></div>
                <span class="font-medium text-sm">Add Money</span>
            </button>
            <button class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-sm hover:shadow-md transition border border-gray-100">
                <div class="w-12 h-12 bg-black text-white rounded-full flex items-center justify-center mb-3 text-lg"><i class="fa-solid fa-rotate"></i></div>
                <span class="font-medium text-sm">Convert</span>
            </button>
        </div>

        <!-- Recent Transactions -->
        <div>
            <h3 class="text-xl font-bold mb-4">Recent Transactions</h3>
            <div class="bg-white rounded-2xl p-2 shadow-sm border border-gray-100">
                <!-- Empty state for now -->
                <div class="p-6 text-center text-gray-500">
                    No recent transactions found
                </div>
            </div>
        </div>
    </div>

    <!-- Right Sidebar for Exchange Rates -->
    <div class="w-80 bg-white border-l border-gray-200 p-6 flex flex-col">
        <h3 class="text-lg font-bold mb-6">Live Exchange Rates</h3>
        
        <div class="space-y-4">
            <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-100 text-green-600 rounded-full flex items-center justify-center font-bold"><i class="fa-solid fa-dollar-sign"></i></div>
                    <span class="font-medium">USDT / INR</span>
                </div>
                <span class="font-bold text-gray-900">₹83.45</span>
            </div>
            
            <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold"><i class="fa-solid fa-dollar-sign"></i></div>
                    <span class="font-medium">USD / EUR</span>
                </div>
                <span class="font-bold text-gray-900">€0.92</span>
            </div>
        </div>
        
        <div class="mt-auto p-4 bg-blue-50 rounded-xl text-sm text-blue-800">
            <p class="font-semibold mb-1"><i class="fa-solid fa-circle-info"></i> Network Status</p>
            <p>Arc Testnet is running smoothly</p>
        </div>
    </div>

    <script>
        // Simple Greeting Logic
        const hour = new Date().getHours();
        const greeting = hour < 12 ? "Good Morning" : hour < 18 ? "Good Afternoon" : "Good Evening";
        document.getElementById("greeting").innerText = greeting;

        let isINR = false;
        let busdBalance = "0.00";

        function toggleCurrency() {
            isINR = !isINR;
            const display = document.getElementById("balanceDisplay");
            if(isINR) {
                let inrValue = (parseFloat(busdBalance) * 83.45).toFixed(2);
                display.innerHTML = inrValue + ' <span class="text-2xl text-gray-400">INR</span>';
            } else {
                display.innerHTML = busdBalance + ' <span class="text-2xl text-gray-400">BUSD</span>';
            }
        }

        // Wallet Connect Logic (Basic Setup)
        const connectBtn = document.getElementById('connectBtn');
        const walletAddress = document.getElementById('walletAddress');
        const contractAddress = "0xf42c56e47362CECB426B95a65AeCC87d8007ec97";

        connectBtn.addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    walletAddress.innerText = account.substring(0, 6) + "..." + account.substring(38);
                    connectBtn.innerText = "Connected";
                    connectBtn.classList.replace('bg-black', 'bg-green-600');
                    
                    // Future: Add logic to fetch actual BUSD balance from contract here
                    busdBalance = "1000.00"; // Dummy balance to show UI works
                    document.getElementById("balanceDisplay").innerHTML = busdBalance + ' <span class="text-2xl text-gray-400">BUSD</span>';
                } catch (error) {
                    console.error("Connection failed", error);
                }
            } else {
                alert("Please install MetaMask!");
            }
        });
    </script>
</body>
</html>
